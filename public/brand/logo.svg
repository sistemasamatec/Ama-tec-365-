<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>

  <!-- Modern Technical Emblem -->
  <g transform="translate(10, 10)">
    <!-- Shield / Hexagon Frame -->
    <path d="M 50 5 L 88 27 L 88 73 L 50 95 L 12 73 L 12 27 Z" 
          fill="#0F172A" stroke="url(#primaryGrad)" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Electronic Circuit Paths -->
    <path d="M 28 35 L 42 35 L 50 48 L 72 48" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="35" r="4" fill="#38BDF8" />
    <circle cx="72" cy="48" r="4" fill="#38BDF8" />

    <path d="M 72 65 L 58 65 L 50 52 L 28 52" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
    <circle cx="72" cy="65" r="4" fill="#0284C7" />
    <circle cx="28" cy="52" r="4" fill="#0284C7" />

    <!-- Central Microchip Core -->
    <rect x="42" y="42" width="16" height="16" rx="3" fill="#0284C7" />
    <path d="M 46 50 L 54 50 M 50 46 L 50 54" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <!-- Brand Name: "Ama Tec" (separated strictly per guidelines) -->
  <text x="125" y="62" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5" fill="#0F172A">
    Ama <tspan fill="#0284C7">Tec</tspan>
  </text>

  <!-- Official Descriptor -->
  <text x="126" y="86" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12.5" letter-spacing="1.2" fill="#64748B">
    ASSISTÊNCIA TÉCNICA DE EQUIPAMENTOS ELETRÓNICOS
  </text>

  <!-- Subtle Precision Rule -->
  <line x1="126" y1="94" x2="475" y2="94" stroke="#E2E8F0" stroke-width="1.5" />
</svg>
